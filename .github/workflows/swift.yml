name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate package, specs, docs, and security baseline
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Local-equivalent validation
        run: make ci

  ios-simulator-build:
    name: Build iOS application for Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select full Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Build checked-in app and scheme
        run: make ios-build

  ios-ui-tests:
    name: iPhone Simulator UI acceptance
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select full Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Run simulator UI acceptance
        run: make ios-ui-test
