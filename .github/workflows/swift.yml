name: CI

on:
  pull_request:
  push:
    branches: [main]

# Each new commit supersedes earlier PR check runs without cancelling other PRs
# or main-branch validations.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate package, specs, docs, and security baseline
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Local-equivalent validation
        run: make ci

  ios-simulator-build:
    name: Build iOS application for Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select full Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Build checked-in app and scheme
        run: make ios-build

  ios-release-build:
    name: Build unsigned iOS Release configuration
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select full Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Compile shipping configuration without signing
        run: make ios-release-build

  ios-ui-tests:
    name: iPhone Simulator UI acceptance
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select full Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Run simulator UI acceptance
        run: make ios-ui-test
